spring:
  application:
    name: bank-system
  datasource:
    url: jdbc:h2:mem:bankdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false

bank:
  features:
    account-creation: true
    withdrawal: true
    transaction-history: true
    account-closure: false
    withdrawal-fee: false  # 出金手数料の有効/無効（withdrawal フラグに依存）
  withdrawal:
    fee-rate: 0.01  # 手数料率（デフォルト: 1%）
